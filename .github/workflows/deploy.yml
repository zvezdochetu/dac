name: Build MkDocs and Deploy to Yandex S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        #  cache: 'pip'

      # 1. Сборка сайта MkDocs
      - name: Install dependencies & Build MkDocs
        run: |
          pip install mkdocs-material playwright
          python -m playwright install chromium
          mkdocs build

      # 2. Отдаем в YC S3
      - name: Sync site to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync ./site s3://dac.documentat.io/ \
            --endpoint-url https://storage.yandexcloud.net \
            --delete